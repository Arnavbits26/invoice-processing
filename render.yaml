services:
  - type: web
    name: invoice-to-decision
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: STAGE_DELAY
        value: "0.45"
      - key: EXTRACTOR
        value: auto
      - key: GEMINI_API_KEY
        sync: false   # paste in the Render dashboard; optional
